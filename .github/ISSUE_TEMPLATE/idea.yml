name: Idea
description: A new mode, a new game, or a way to make one more fun
labels: [enhancement]
body:
  - type: dropdown
    id: game
    attributes:
      label: For
      options: [Snake, Pac-Man, Course, Casse-briques, A new game, The site]
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      placeholder: What would change for the player?
    validations:
      required: true
