version: 2
updates:
  # Actions are pinned by commit SHA; Dependabot moves the SHA and rewrites the `# vX.Y.Z`
  # comment. scripts/check-latest.mjs fails CI while such a bump sits unmerged.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']

  # pre-commit freezes its hook repos to a commit SHA (`# frozen: vX`). Without this the
  # secret scanner and the workflow linter stay at whatever version they were added at.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      pre-commit:
        patterns: ['*']

  # Dev tooling only: nothing from npm ships to the browser.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      dev-tooling:
        patterns: ['*']
    ignore:
      # Mirrors the hold in .dependency-holds.json: types follow the Node LTS in .node-version.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
