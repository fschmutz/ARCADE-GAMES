# Fails a pull request that claims authorship this repository does not own: a commit whose
# author or committer is not in .github/attribution-allow.txt, or a name, commit message,
# pull request title or body carrying a co-author trailer or an AI tool signature.
#
# The check is named "attribution guard"; branch protection has to require that context by
# name, so renaming the job silently drops it from the required checks.
#
# Pull request text reaches the script through the environment and a file, never through the
# shell: a title is attacker-controlled on a fork, and `run:` interpolation would execute it.
#
# Actions are SHA-pinned to the release named in the comment, like every other workflow here;
# scripts/check-latest.mjs fails the build when a pin falls behind.
name: Attribution guard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: attribution guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The guard walks the commits the event added, so it needs their history.
          fetch-depth: 0
          persist-credentials: false

      - name: Guard tests
        run: scripts/tests/attribution-guard-test.sh

      - name: Commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          head="${HEAD_SHA:-$(git rev-parse HEAD)}"
          # github.event.before is all zeroes on a branch's first push, and a force push can
          # leave it unreachable; fall back to the pushed commit alone.
          if [ -n "${BASE_SHA:-}" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            range="${BASE_SHA}..${head}"
          else
            range="${head}~1..${head}"
          fi
          echo "scanning $range"
          scripts/attribution-guard.sh --range "$range"

      - name: Pull request title and body
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          printf '%s\n\n%s\n' "${PR_TITLE:-}" "${PR_BODY:-}" > "${RUNNER_TEMP}/pr.txt"
          scripts/attribution-guard.sh --label 'pull request body' \
            --text-file "${RUNNER_TEMP}/pr.txt"
