name: attribution-guard

# Bundle A — core. Always on.
#
# The author of record is the human who owns the change. This job fails a pull
# request that carries somebody else's name: a commit authored or committed by
# an address that is not on `.github/attribution-allow.txt`, a
# `Co-authored-by:` trailer naming anyone else, an assistant footer in a commit
# message, or one in the pull request body.
#
# It is a separate workflow rather than a job in `ci.yml` for one reason: the
# body is editable after the fact. `ci.yml` runs on the default pull_request
# types, which do not include `edited`, so a footer pasted into the description
# ten minutes after the last push would never be looked at again.
#
# Everything it knows lives in `scripts/attribution-guard.sh`, which reads the
# commits through the API and the body out of the event payload. The fixtures
# run first: a guard that has quietly stopped matching is worse than no guard,
# because the check is green either way.
#
# The job name, `attribution guard`, is in the ruleset example's required
# status checks. Keep the two in step.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: attribution-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    name: attribution guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The guard still catches what it is for
        run: ./scripts/tests/attribution-guard-test.sh

      # GH_TOKEN is the pull request's own read-only token: the script calls
      # repos/:repo/pulls/:number/commits, and nothing else.
      - name: This pull request carries no foreign attribution
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/attribution-guard.sh
