<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px;
    height: 630px;
    box-sizing: border-box;
    padding: 64px 72px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    font-family: -apple-system, BlinkMacSystemFont, "Inter var", Inter, "Segoe UI", system-ui, Roboto, sans-serif;
    color: #e2e8f0;
    background: #0a0a0f;
    background-image:
      radial-gradient(at 12% 18%, rgba(99, 102, 241, 0.28) 0, transparent 45%),
      radial-gradient(at 88% 12%, rgba(236, 72, 153, 0.20) 0, transparent 50%),
      radial-gradient(at 50% 100%, rgba(34, 211, 238, 0.18) 0, transparent 45%);
  }
  h1 { margin: 0; font-size: 104px; letter-spacing: -0.03em; line-height: 1; }
  .sub { margin: 16px 0 0; font-size: 34px; color: #94a3b8; }
  .tiles { display: flex; gap: 28px; }
  .tile { flex: 1; border: 2px solid #1e293b; border-radius: 18px; background: #0f172a; padding: 18px; }
  .tile svg { width: 100%; height: auto; display: block; border-radius: 10px; }
  .tile b { display: block; margin-top: 12px; font-size: 30px; }
  .credit {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.06em;
    background: linear-gradient(90deg, #818cf8, #ec4899, #22d3ee);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
</style>
</head>
<body>
  <div>
    <h1>Arcade</h1>
    <p class="sub">Snake, Pac-Man et Course, dans le navigateur, même hors ligne.</p>
  </div>
  <div class="tiles">
    <div class="tile">
      <svg viewBox="0 0 240 110"><rect width="240" height="110" fill="#111827"/>
        <g fill="#6366f1"><rect x="40" y="55" width="18" height="18" rx="4" opacity=".6"/><rect x="60" y="55" width="18" height="18" rx="4" opacity=".7"/><rect x="80" y="55" width="18" height="18" rx="4" opacity=".8"/><rect x="100" y="55" width="18" height="18" rx="4" opacity=".9"/><rect x="100" y="35" width="18" height="18" rx="4"/><rect x="120" y="35" width="18" height="18" rx="4"/></g>
        <rect x="140" y="35" width="18" height="18" rx="4" fill="#22d3ee"/><circle cx="190" cy="44" r="8" fill="#facc15"/></svg>
      <b>Snake</b>
    </div>
    <div class="tile">
      <svg viewBox="0 0 240 110"><rect width="240" height="110" fill="#111827"/><rect x="12" y="12" width="216" height="86" rx="6" fill="none" stroke="#6366f1" stroke-width="2"/>
        <path d="M70 55 L95 42 A28 28 0 1 0 95 68 Z" fill="#facc15"/><g fill="#e2e8f0"><circle cx="110" cy="55" r="3"/><circle cx="130" cy="55" r="3"/><circle cx="150" cy="55" r="3"/></g>
        <path d="M168 68 V50 A14 14 0 0 1 196 50 V68 l-5 -5 -4.5 5 -4.5 -5 -4.5 5 -4.5 -5 Z" fill="#ef4444"/><g fill="#f8fafc"><circle cx="177" cy="51" r="4"/><circle cx="188" cy="51" r="4"/></g></svg>
      <b>Pac-Man</b>
    </div>
    <div class="tile">
      <svg viewBox="0 0 240 110"><rect width="240" height="110" fill="#0b2e22"/><rect x="60" width="120" height="110" fill="#1e293b"/>
        <g fill="#e2e8f0"><rect x="118" y="4" width="4" height="20"/><rect x="118" y="44" width="4" height="20"/><rect x="118" y="84" width="4" height="20"/></g>
        <rect x="76" y="12" width="26" height="44" rx="7" fill="#ef4444"/><rect x="138" y="56" width="26" height="44" rx="7" fill="#6366f1"/><circle cx="90" cy="84" r="7" fill="#f59e0b"/></svg>
      <b>Course</b>
    </div>
  </div>
  <div class="credit">Lino from Marrakech</div>
</body>
</html>
